# ASUS/TLP profile orchestrator configuration.
# CPU limits live in /etc/tlp.d/01-asus-g16-power.conf; do not duplicate them
# here because that creates misleading settings which the script never applies.

# Reject duplicate Fn-key events while still allowing explicit --set commands.
PROFILE_DEBOUNCE_SECONDS=4
TLP_SYNC_ATTEMPTS=30
TLP_SYNC_INTERVAL=0.2

# Quiet mode relies on ASUS Quiet + TLP power-saver + 60 Hz. Keep interactive
# state under the user's control: do not raise/lower brightness, kill apps, or
# disable radios unless explicitly opted in below.
QUIET_BRIGHTNESS=""
QUIET_STOP_CAVA=0
QUIET_DISABLE_WWAN=0
QUIET_WIFI_POWERSAVE=1
QUIET_AUTOSUSPEND_BLUETOOTH=0

# 通知持续时间（毫秒）
NOTIFICATION_TIMEOUT=3000

# 日志文件最大行数
MAX_LOG_LINES=100
