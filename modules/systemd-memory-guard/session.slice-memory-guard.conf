[Slice]
# session.slice contains core desktop infrastructure (D-Bus, PipeWire,
# WirePlumber, portals and UWSM), not ordinary graphical workloads.
# Reserve a small working set and never let oomd select this slice.
MemoryMin=1G
MemoryLow=2G
MemoryHigh=infinity
MemoryMax=infinity
MemorySwapMax=infinity
ManagedOOMMemoryPressure=auto
ManagedOOMSwap=auto
ManagedOOMPreference=omit
