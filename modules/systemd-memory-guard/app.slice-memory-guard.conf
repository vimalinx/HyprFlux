[Slice]
# Applications may use all available RAM and swap. There is no fixed quota.
# Do not kill applications based on PSI pressure. Keep only a near-exhaustion
# swap emergency brake; desktop infrastructure is protected separately.
MemoryHigh=infinity
MemoryMax=infinity
MemorySwapMax=infinity
ManagedOOMMemoryPressure=auto
ManagedOOMSwap=kill
