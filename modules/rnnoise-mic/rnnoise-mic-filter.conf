context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "RNNoise Microphone"
            media.name       = "RNNoise Microphone"
            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = hpL
                        label = bq_highpass
                        control = { "Freq" = 120.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = hpR
                        label = bq_highpass
                        control = { "Freq" = 120.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" = 30.0
                            "VAD Grace Period (ms)" = 200.0
                            "Retroactive VAD Grace (ms)" = 50.0
                            "Dry Mix" = 0.2
                        }
                    }
                    {
                        type = builtin
                        name = gainL
                        label = mixer
                        control = { "Gain 1" = 1.0 }
                    }
                    {
                        type = builtin
                        name = gainR
                        label = mixer
                        control = { "Gain 1" = 1.0 }
                    }
                ]
                links = [
                    { output = "hpL:Out" input = "rnnoise:Input (L)" }
                    { output = "hpR:Out" input = "rnnoise:Input (R)" }
                    { output = "rnnoise:Output (L)" input = "gainL:In 1" }
                    { output = "rnnoise:Output (R)" input = "gainR:In 1" }
                ]
                inputs  = [ "hpL:In" "hpR:In" ]
                outputs = [ "gainL:Out" "gainR:Out" ]
            }
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "effect_input.codex-mic-rnnoise"
                node.target = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                node.passive = true
            }
            playback.props = {
                node.name = "effect_output.codex-mic-rnnoise"
                node.description = "RNNoise Microphone"
                media.class = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
]
