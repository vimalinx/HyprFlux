# Keep normal desktop GUI applications on Intel/Mesa in compute-only NVIDIA mode.
# CUDA and explicit NVIDIA compute still work; Vulkan dGPU apps can override this.
DRI_PRIME=0
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.json
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/intel_icd.json
GSK_RENDERER=ngl
