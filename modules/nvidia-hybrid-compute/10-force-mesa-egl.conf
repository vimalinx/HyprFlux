[Service]
# Keep Hyprland itself from loading NVIDIA's EGL vendor library in compute-only
# mode. Hyprland config env lines affect children after the compositor starts,
# so this belongs at the systemd unit boundary.
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=DRI_PRIME=0
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.json
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/intel_icd.json
Environment=GSK_RENDERER=ngl
UnsetEnvironment=__NV_PRIME_RENDER_OFFLOAD __GLX_VENDOR_LIBRARY_NAME GBM_BACKEND LIBVA_DRIVER_NAME NVD_BACKEND __VK_LAYER_NV_optimus
